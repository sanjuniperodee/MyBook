# /etc/nginx/sites-available/mybook — замените mybook.example.kz на свой домен.
# Звук звонков WhatsApp: sudo cp deploy/nginx-wa-call.conf /etc/nginx/snippets/mybook-wa-call.conf (или bash deploy/wa-calls-nginx.sh).
# Затем: sudo ln -s /etc/nginx/sites-available/mybook /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d mybook.example.kz
# max_fails=0: не помечать приложение «упавшим» на 10 с (fail_timeout) после первого отказа в соединении.
# Иначе при деплое, пока процесс перезапускается, nginx продолжает отдавать 502 ещё ~10 с после того, как он поднялся.
# backup: проверенная новая версия на 3041 (её поднимает deploy/deploy.sh) отвечает, пока PM2 перезапускает основную —
# во время выкатки посетители не видят 502. В обычное время на 3041 никого нет, nginx туда не ходит.
upstream mybook_app {
    server localhost:3040 max_fails=0;
    server localhost:3041 backup max_fails=0;
}

server {
    listen 80;
    server_name mybook.example.kz;

    # загрузка фото (до 25 МБ за файл, по 3 файла за запрос)
    client_max_body_size 80m;

    # Звонки WhatsApp из CRM: звук браузера ↔ шлюз WhatsApp (см. deploy/nginx-wa-call.conf, ставит deploy/wa-calls-nginx.sh).
    include snippets/mybook-wa-call.conf;

    location / {
        proxy_pass http://mybook_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # генерация PDF для типографии может идти до минуты
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
