# /etc/nginx/sites-available/mybook — замените mybook.example.kz на свой домен.
# Затем: sudo ln -s /etc/nginx/sites-available/mybook /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d mybook.example.kz
server {
    listen 80;
    server_name mybook.example.kz;

    # загрузка фото (до 25 МБ за файл, по 3 файла за запрос)
    client_max_body_size 80m;

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # генерация PDF для типографии может идти до минуты
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
