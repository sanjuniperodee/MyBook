# Карта маршрутов NestJS (mybook-backend :3046) по контекстам ADR 0014.
# Подключается в /etc/nginx/sites-available/mybooks-kz ДО общего `location ^~ /api/v1/` (127.0.0.1:3044).
#
# Включение контекста (после зелёного MYBOOK_NEST_SHADOW=on и 0 расхождений):
#   1. Раскомментировать блок нужного контекста ниже.
#   2. sudo nginx -t && sudo systemctl reload nginx
#
# Аварийный откат в 1 строку:
#   - одного контекста: закомментировать его блок здесь → sudo nginx -t && sudo systemctl reload nginx
#   - всех сразу: закомментировать строку `include snippets/mybook-nest-contexts.conf;` в sites-available/mybooks-kz → sudo nginx -t && sudo systemctl reload nginx

# Служебный список маршрутов NestJS для теневой сверки — снаружи всегда закрыт.
location ^~ /api/v1/__nest/ {
    return 404;
}

