# Звук звонков WhatsApp из CRM (snippets/mybook-wa-call.conf, подключается в server сайта: include snippets/mybook-wa-call.conf;).
# Ставит deploy/wa-calls-nginx.sh. Next не принимает WebSocket в маршрутах, поэтому поток браузера идёт к шлюзу WhatsApp
# (GOWA со звонками на 127.0.0.1:3020) мимо сайта. Пускает сайт: auth_request спрашивает его, чей это звонок (сессия,
# право на звонки, звонок сотрудника и ещё идёт), и получает заголовок Authorization к шлюзу — логин шлюза остаётся на
# сервере и в браузер не попадает.
location = /wa-call/audio {
    auth_request /_wa_call_auth;
    auth_request_set $wa_gw_auth $upstream_http_x_gw_authorization;
    # Шлюзу уходит ровно тот id звонка, который проверил сайт (заголовок ответа), а не своё прочтение адреса nginx:
    # $arg_ иначе читает имя без учёта регистра и после нормализации пути — и мог бы подставить чужой звонок.
    auth_request_set $wa_call_id $upstream_http_x_wa_call_id;
    proxy_pass http://127.0.0.1:3020/call/audio?device_id=mybooks&call_id=$wa_call_id;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host 127.0.0.1;
    proxy_set_header Authorization $wa_gw_auth;
    proxy_set_header Cookie "";
    proxy_buffering off;
    # Разговор длится сколько угодно: соединение закрывает конец звонка, а не тишина в канале.
    proxy_read_timeout 4h;
    proxy_send_timeout 4h;
}

# Прослушка идущего звонка руководителем: только приём, копия обеих сторон (шлюз /call/listen). Пускает сайт:
# право «Слушать записи разговоров», чужой звонок, разговор ещё идёт; каждое подключение — в журнале действий.
location = /wa-call/listen {
    auth_request /_wa_call_listen_auth;
    auth_request_set $wa_gw_auth $upstream_http_x_gw_authorization;
    auth_request_set $wa_call_id $upstream_http_x_wa_call_id;
    proxy_pass http://127.0.0.1:3020/call/listen?device_id=mybooks&call_id=$wa_call_id;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host 127.0.0.1;
    proxy_set_header Authorization $wa_gw_auth;
    proxy_set_header Cookie "";
    proxy_buffering off;
    proxy_read_timeout 4h;
    proxy_send_timeout 4h;
}

location = /_wa_call_listen_auth {
    internal;
    proxy_pass http://mybook_app/api/admin/calls/whatsapp/listen-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP "";
    proxy_set_header Upgrade "";
    proxy_set_header Connection "";
}

location = /_wa_call_auth {
    internal;
    proxy_pass http://mybook_app/api/admin/calls/whatsapp/audio-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Без X-Real-IP: так сайт отличает этот подзапрос от запросов снаружи — прокси сайта (snippets/mybook-proxy.conf)
    # ставит X-Real-IP всегда, а сам Next его не добавляет.
    proxy_set_header X-Real-IP "";
    proxy_set_header Upgrade "";
    proxy_set_header Connection "";
}

# Сами адреса пропусков снаружи закрыты — и с языковым префиксом (/kk/… сайт переписывает на тот же маршрут).
location ~* /api/admin/calls/whatsapp/(audio|listen)-auth {
    return 404;
}
