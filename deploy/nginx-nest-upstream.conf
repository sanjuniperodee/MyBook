# Бэкенд MyBooks на NestJS (ADR 0014): основной процесс mybook-backend на 127.0.0.1:3046,
# запасной при недоступности соединения — прежний mybook-api на 127.0.0.1:3044 (без 502 при перезапуске).
upstream mybook_nest {
    server 127.0.0.1:3046 max_fails=0;
    server 127.0.0.1:3044 backup max_fails=0;
}
