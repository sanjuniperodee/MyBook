services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mybook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mybook}
      POSTGRES_DB: mybook
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mybook"]
      interval: 5s
      retries: 10

  # Redis нужен, только если приложение запущено в нескольких экземплярах (общие лимиты и защита кодов 2FA).
  # Включение: docker compose --profile scale up -d и REDIS_URL=redis://redis:6379 в .env.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["scale"]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://mybook:${POSTGRES_PASSWORD:-mybook}@db:5432/mybook
      STORAGE_DIR: /data/storage
      KASPI_API_URL: ${KASPI_API_URL:-http://kaspi-pos:3000}
      GOWA_API_URL: ${GOWA_API_URL:-http://gowa:3000}
    ports:
      - "3000:3000"
    volumes:
      - storage:/data/storage

  # Оплата через Kaspi Pay (необязательно): docker compose --profile kaspi up -d --build, затем кассир подключается
  # в CRM → «Интеграции» → Kaspi Pay. Порт наружу не открываем: сервис держит сессию кассира.
  kaspi-pos:
    build: ./deploy/kaspi-pos
    restart: unless-stopped
    profiles: ["kaspi"]
    environment:
      # Ключ шифрования сессии (64 hex-символа: openssl rand -hex 32), задаётся один раз.
      TOKEN_SECRET_KEY: ${KASPI_TOKEN_SECRET_KEY:-}
      KASPI_WEBHOOK_URL: http://app:3000/api/payments/kaspi/webhook
      KASPI_WEBHOOK_SECRET: ${KASPI_WEBHOOK_SECRET:-}
    volumes:
      - kaspi:/data

  # Свой шлюз WhatsApp вместо Wazzup (необязательно): GOWA — go-whatsapp-web-multidevice (MIT, Go, ~50 МБ памяти).
  # docker compose --profile whatsapp up -d, затем CRM → «Интеграции» → «WhatsApp — свой шлюз»: выбрать GOWA и привязать
  # номер по QR. Порт наружу не открываем: шлюз держит сессию номера магазина. GOWA_WEBHOOK_SECRET обязателен
  # (без него шлюз подписывает вебхуки словом «secret», и сайт их отклонит).
  gowa:
    image: aldinokemal2104/go-whatsapp-web-multidevice:v9.6.0
    restart: unless-stopped
    profiles: ["whatsapp"]
    environment:
      APP_PORT: "3000"
      APP_OS: MyBooks CRM
      APP_BASIC_AUTH: ${GOWA_BASIC_AUTH:-}
      WHATSAPP_WEBHOOK: http://app:3000/api/integrations/gowa
      WHATSAPP_WEBHOOK_SECRET: ${GOWA_WEBHOOK_SECRET:-}
      WHATSAPP_WEBHOOK_EVENTS: message,message.ack
      WHATSAPP_WEBHOOK_IGNORE_JIDS: "@g.us"
      WHATSAPP_AUTO_DOWNLOAD_MEDIA: "true"
      WHATSAPP_ACCOUNT_VALIDATION: "false"
    volumes:
      - gowa-storages:/app/storages
      - gowa-statics:/app/statics

volumes:
  pgdata:
  storage:
  kaspi:
  gowa-storages:
  gowa-statics:
