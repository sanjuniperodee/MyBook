services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mybook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mybook}
      POSTGRES_DB: mybook
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mybook"]
      interval: 5s
      retries: 10

  # Redis нужен, только если приложение запущено в нескольких экземплярах (общие лимиты и защита кодов 2FA).
  # Включение: docker compose --profile scale up -d и REDIS_URL=redis://redis:6379 в .env.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["scale"]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://mybook:${POSTGRES_PASSWORD:-mybook}@db:5432/mybook
      STORAGE_DIR: /data/storage
      # Адреса сервисов рядом — значения по умолчанию, в «Интеграциях» их можно сменить.
      KASPI_API_URL: http://kaspi-pos:3000
      GOWA_API_URL: http://gowa:3000
      GOWA_CALLBACK_URL: http://app:3000/api/integrations/gowa
    ports:
      - "3000:3000"
    volumes:
      - storage:/data/storage

  # Оплата через Kaspi Pay: kaspi-pos-automation (MIT). Кассир подключается в CRM → «Интеграции» → Kaspi Pay, пока
  # оплата там не включена, сервис просто ждёт. Порт наружу не открываем: сервис держит сессию кассира и без авторизации.
  # Ключ шифрования сессии создаётся сам и хранится в томе; KASPI_WEBHOOK_SECRET — необязательно.
  kaspi-pos:
    build: ./deploy/kaspi-pos
    restart: unless-stopped
    environment:
      TOKEN_SECRET_KEY: ${KASPI_TOKEN_SECRET_KEY:-}
      KASPI_WEBHOOK_URL: http://app:3000/api/payments/kaspi/webhook
      KASPI_WEBHOOK_SECRET: ${KASPI_WEBHOOK_SECRET:-}
    volumes:
      - kaspi:/data

  # Свой шлюз WhatsApp вместо Wazzup: GOWA — go-whatsapp-web-multidevice (MIT, Go, ~50 МБ памяти). Всё настраивается в
  # CRM → «Интеграции» → «WhatsApp — свой шлюз»: выбрать GOWA, сохранить (сайт сам заведёт в шлюзе устройство магазина
  # со своим вебхуком) и привязать номер по QR. Порт наружу не открываем: шлюз держит сессию номера магазина.
  # GOWA_BASIC_AUTH (логин:пароль) — необязательно, тогда тот же логин:пароль укажите в «Интеграциях».
  # Скорость: шлюз обрабатывает события номера по очереди, а фото скачивает до отправки вебхука — поэтому фото статусов
  # (истории всех контактов телефона магазина) не качаем, а группы, каналы и рассылки на сайт не шлём. Сообщения,
  # которые вебхук не донёс (сайт перезапускался), сайт сам забирает из хранилища шлюза раз в 30 секунд.
  # Логи шлюза содержат текст каждого сообщения — храним не больше 3 × 10 МБ.
  gowa:
    image: aldinokemal2104/go-whatsapp-web-multidevice:v9.6.0
    restart: unless-stopped
    environment:
      APP_PORT: "3000"
      APP_OS: MyBooks CRM
      APP_BASIC_AUTH: ${GOWA_BASIC_AUTH:-}
      APP_UI_ENABLED: "false"
      MCP_ENABLED: "false"
      WHATSAPP_WEBHOOK_IGNORE_JIDS: "@g.us,@newsletter,@broadcast"
      WHATSAPP_AUTO_DOWNLOAD_MEDIA: "true"
      WHATSAPP_IGNORE_STATUS_MEDIA: "true"
      WHATSAPP_ACCOUNT_VALIDATION: "false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - gowa-storages:/app/storages
      - gowa-statics:/app/statics

volumes:
  pgdata:
  storage:
  kaspi:
  gowa-storages:
  gowa-statics:
