# Проверки и выкатка на прод. Проверки (типы, линтер, тесты в пяти частях, сборка) идут параллельно; выкатка ждёт
# все и запускается только для master: при пуше или вручную. На pull request — только проверки, без выкатки.
# Сервер (общий с другими сайтами) не собирает: сборка не помещалась в его память и тормозила сайты — на сервер
# уезжает готовый архив (deploy/ci-run.sh). Нужен секрет DEPLOY_SSH_KEY — закрытый ключ, открытая часть которого
# лежит в ~/.ssh/authorized_keys на сервере.
name: Выкатка на прод

# Только документы (docs/, *.md, навыки .claude/) — без проверок и выкатки: в прод нечего везти, а очередь выкаток общая.
on:
  push:
    branches: [master]
    paths-ignore: ["docs/**", "**/*.md", ".claude/**"]
  pull_request:
    branches: [master]
    paths-ignore: ["docs/**", "**/*.md", ".claude/**"]
  workflow_dispatch:

# Новый пуш в ту же ветку PR отменяет старые проверки; пуши в master проверяются все (каждый может уехать на прод).
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: 1
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  types:
    name: Типы
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      # Сайт и бэкенд на Nest (у него свой tsconfig с декораторами, ADR 0014).
      - run: npm run typecheck

  lint:
    name: Линтер
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  # Тесты в шести частях. Пять PDF-файлов — три части (characterization/render верстает все книги набора в beforeAll);
  # остальные файлы (через --exclude) делятся на три шарда: новый тестовый файл попадает в них сам и не выпадет из
  # проверки. Переименовали PDF-файл — его часть упадёт с «No test files found», а не пропустит тесты молча.
  # Замер 05.11: одной частью «остальные» шли 306 с; локально теперь шарды по 13–17 с, PDF-части по 41–53 с.
  test:
    name: Тесты (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [PDF 1, PDF 2, PDF 3, 1/3, 2/3, 3/3]
        include:
          - part: PDF 1
            args: tests/characterization/render.test.ts tests/pdf.test.tsx
          # PDF 2 (три файла, 162–167 с) задерживал выкатку дольше сборки — разделён на два (24.11).
          - part: PDF 2
            args: tests/pdf-opener-limits.test.ts
          - part: PDF 3
            args: tests/pdf-critical.test.ts tests/cover-back-color.test.tsx
          - part: 1/3
            args: --shard=1/3
          - part: 2/3
            args: --shard=2/3
          - part: 3/3
            args: --shard=3/3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      # PDF-тесты сверяют текст и растр полос через pdftotext и pdftoppm.
      - name: poppler-utils для PDF-тестов
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: vitest
        run: |
          if [[ "${{ matrix.part }}" == PDF* ]]; then
            npx vitest run ${{ matrix.args }}
          else
            npx vitest run ${{ matrix.args }} --exclude tests/pdf-opener-limits.test.ts --exclude tests/pdf-critical.test.ts \
              --exclude tests/pdf.test.tsx --exclude tests/cover-back-color.test.tsx --exclude tests/characterization/render.test.ts
          fi

  # Go-сервисы (services/*, ADR 0011): формат, go vet, тесты.
  go:
    name: Go
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: services/files/go.mod, cache-dependency-path: services/files/go.mod }
      - name: mybook-files
        working-directory: services/files
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt: файлы выше не отформатированы"; exit 1; }
          go vet ./...
          go test ./...

  # Dart-клиент API v1 (генерирует scripts/contracts/generate.ts): маршруты добавляют разные сессии — генератор не должен
  # выдать код, который приложение не соберёт. Само приложение — в mybook-mobile (ADR 0013), поэтому клиент собирается в
  # маленький пакет с той же зависимостью (package:http) и анализируется строго, как в CI приложения.
  dart-client:
    name: Dart-клиент
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.44.1, cache: true }
      - name: dart analyze
        run: |
          mkdir -p /tmp/dart-client/lib/api
          npx tsx scripts/contracts/generate.ts --dart /tmp/dart-client/lib/api/mybook_api.g.dart
          git diff --exit-code packages/contracts/openapi.json
          cd /tmp/dart-client
          printf 'name: dart_client\npublish_to: none\nenvironment:\n  sdk: ^3.12.1\ndependencies:\n  http: ^1.6.0\ndev_dependencies:\n  lints: any\n' > pubspec.yaml
          printf 'include: package:lints/recommended.yaml\n' > analysis_options.yaml
          dart pub get
          dart analyze --fatal-infos lib

  # Новый Dart-клиент — пулл-реквестом в mybook-mobile (ADR 0013). Работает только при секрете MOBILE_REPO_TOKEN
  # (fine-grained токен владельца: mybook-mobile, Contents и Pull requests — запись; как завести — README mybook-mobile).
  # Без секрета ничего не делает. Выкатку не задерживает: от неё ничего не зависит.
  mobile-client-pr:
    name: Dart-клиент → mybook-mobile
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HAS_TOKEN: ${{ secrets.MOBILE_REPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with: { repository: sanjuniperodee/mybook-mobile, path: app, token: "${{ secrets.MOBILE_REPO_TOKEN }}" }
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with: { node-version: 22, cache: npm }
      - if: env.HAS_TOKEN == 'true'
        run: npm ci --no-audit --no-fund
      - name: генерация и пулл-реквест
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.MOBILE_REPO_TOKEN }}
        run: |
          npx tsx scripts/contracts/check-dart.ts app && exit 0
          npx tsx scripts/contracts/generate.ts --dart app/lib/api/mybook_api.g.dart
          cd app
          branch="api-v1/${GITHUB_SHA::8}"
          git config user.name "mybook-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -b "$branch"
          git add lib/api/mybook_api.g.dart
          git commit -m "Клиент API v1 из бэкенда ${GITHUB_SHA::8}"
          git push -u origin "$branch"
          gh pr create --repo sanjuniperodee/mybook-mobile --head "$branch" --base main \
            --title "Клиент API v1 из бэкенда ${GITHUB_SHA::8}" \
            --body "Сгенерирован scripts/contracts/generate.ts в MyBook ${GITHUB_SHA}. Проверки — CI этого репозитория."

  shared-package:
    # Пакет @sanjuniperodee/mybook-shared для mybook-web (ADR 0013, шаг 3): контракт API v1 и общий чистый код, типы
    # бэкенда — объявлениями. Версия 0.1.<номер сборки>; веб берёт её в .mybook-shared-version. Публикует GITHUB_TOKEN.
    name: Пакет для веба (mybook-shared)
    needs: [types, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, registry-url: "https://npm.pkg.github.com", scope: "@sanjuniperodee" }
      - run: npm ci --no-audit --no-fund
      - run: node scripts/packages/build-shared.mjs "0.1.${{ github.run_number }}" dist/mybook-shared
      - run: npm publish
        working-directory: dist/mybook-shared
        env: { NODE_AUTH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  # Сборка и архив релиза: бандлы процессов бэкенда esbuild-ом (~30 с, без Next — сайт в mybook-web).
  build:
    name: Сборка
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # mybook-files (services/files) — статический бинарник в релиз: <релиз>/bin/mybook-files, запускает PM2.
      - uses: actions/setup-go@v5
        with: { go-version-file: services/files/go.mod, cache-dependency-path: services/files/go.mod }
      - name: mybook-files
        run: bash services/files/build.sh build/bin
      - name: Архив релиза
        run: |
          bash deploy/pack-release.sh release
          tar -czf mybook.tgz -C release .
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: mybook.tgz
          retention-days: 3
          compression-level: 0

  deploy:
    name: Выкатка
    needs: [types, lint, test, go, dart-client, build]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Выкатки идут по одной; из ожидающих GitHub оставляет только самую свежую.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      # Нужен сам репозиторий: deploy/ci-run.sh и SHA коммита, который сервер подтягивает из origin.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Ключ сервера
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo "185.102.75.191 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ4SUaV/VVBBJ7DtvZ5lJKL2UWNlQGcivWEa3hNEiZk9" >> ~/.ssh/known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Выкатка
        run: bash deploy/ci-run.sh mybook.tgz
